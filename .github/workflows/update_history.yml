
name: Update datasets (history)

on:
  workflow_dispatch:
    ### for testing / debugging allow "manual" start


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v6

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2' # Version range or exact version of a Ruby version to use, using semvers version range syntax.
        bundler-cache: true  # runs 'bundle install' and caches installed gems automatically


    - name: Run install / adduser
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
      run: |
        #  note - ruby setup bundle install uses local vendor install
        #              NOT into default
        # bundle install
        # gem list
        # gem env
        #   get (latest) script sources -- add to mono tree layout
        git clone https://github.com/sportdb/sport.db.v2 sportdb/sport.db.v2 --depth=1
        bundle exec yo adduser


    ## note: only (auto-)require config.rb (and NOT boot.rb) for clone/push
    - name: Run ssh_clone
      run:  bundle exec yo clone

    ###   change ./boot to ./boot_history !!!!
    - name: Run gen json
      run:  bundle exec yo -r ./boot_history json

    - name: Run ssh_push
      run:  bundle exec yo push
